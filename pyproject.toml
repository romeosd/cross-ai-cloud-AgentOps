[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cross-ai-cloud-agentops"
version = "1.0.0"
description = "Multi-cloud AI Agent Orchestration — watsonx Orchestrate as enterprise control plane over AWS Bedrock, Azure Semantic Kernel, and Vertex AI with LangGraph execution and industry-specific use cases"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ramy Amer" }]
requires-python = ">=3.12"

keywords = [
    "watsonx", "orchestrate", "langgraph", "multi-cloud", "agentops",
    "aws-bedrock", "azure-openai", "vertex-ai", "gemini", "enterprise-ai",
    "financial-services", "retail", "telco", "mining", "government"
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # LangGraph — agent execution engine
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-aws>=0.1.9",
    "langchain-openai>=0.1.0",
    "langchain-google-vertexai>=1.0.0",
    "langchain-community>=0.2.0",

    # AWS
    "boto3>=1.34.0",
    "botocore>=1.34.0",

    # Azure
    "openai>=1.35.0",
    "azure-identity>=1.17.0",
    "semantic-kernel>=1.3.0",

    # GCP / Vertex AI
    "google-cloud-aiplatform>=1.60.0",
    "google-generativeai>=0.7.0",
    "vertexai>=1.60.0",

    # watsonx
    "ibm-watsonx-ai>=1.0.0",
    "ibm-generative-ai>=3.0.0",

    # Data & ML
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "pyarrow>=16.0.0",

    # Observability / AgentOps
    "prometheus-client>=0.20.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "structlog>=24.2.0",
    "rich>=13.7.0",

    # Utilities
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "tenacity>=8.3.0",
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "black>=24.4.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
]

[project.urls]
Repository = "https://github.com/romeosd/cross-ai-cloud-AgentOps"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=src --cov-report=term-missing"
